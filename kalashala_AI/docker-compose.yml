

services:

  backend:

    build: ./backend

    container_name: kalashala_backend

    ports:
      - "8000:8000"

    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - CORS_ORIGINS=http://localhost:8501
      - LLM_KEEP_ALIVE=10m
      - HF_HOME=/models/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./backend:/app
      - chroma-data:/app/index_store
      - huggingface-cache:/models/huggingface

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

    restart: unless-stopped

  frontend:

    build: ./frontend

    container_name: kalashala_frontend

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./frontend:/app

    restart: unless-stopped

volumes:
  chroma-data:
  huggingface-cache: